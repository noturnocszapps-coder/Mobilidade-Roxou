name: Build Android APK - Leitura

on:
  push:
    branches:
      - '**'
    paths:
      - 'leitura/**'
      - '.github/workflows/build-apk-leitura.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: leitura
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roxou-mobilidade-leitura-apk
          path: leitura/app/build/outputs/apk/debug/*.apk
