name: Gerar APK de venda

# Roda só quando você manda (Actions > Gerar APK de venda > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rodar os testes
        run: |
          chmod +x gradlew
          ./gradlew :core-domain:test :core-licenca:test --no-daemon

      - name: Preparar a chave de assinatura (Secrets)
        env:
          KEYSTORE: ${{ secrets.ROXOU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "Falta o secret ROXOU_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/venda.jks"

      - name: Gerar o APK de venda (R8 + assinatura própria)
        env:
          ROXOU_KEYSTORE_ARQUIVO: ${{ runner.temp }}/venda.jks
          ROXOU_KEYSTORE_SENHA: ${{ secrets.ROXOU_KEYSTORE_SENHA }}
          ROXOU_KEY_ALIAS: ${{ secrets.ROXOU_KEY_ALIAS }}
          ROXOU_KEY_SENHA: ${{ secrets.ROXOU_KEY_SENHA }}
          ROXOU_API_URL: ${{ vars.ROXOU_API_URL }}
          ROXOU_LICENCA_CHAVE_PUBLICA: ${{ vars.ROXOU_LICENCA_CHAVE_PUBLICA }}
          ROXOU_CERT_SHA256: ${{ vars.ROXOU_CERT_SHA256 }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Dar nome ao APK
        id: apk
        run: |
          NOME="roxou-mobilidade-venda-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NOME"
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: roxou-mobilidade-venda
          path: android/${{ steps.apk.outputs.nome }}
          retention-days: 90
